<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Anubis Guardian — security that covers the repository, guides the AI agent, and catches risks before they ship">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/><stop offset="0.55" stop-color="#0a1b26"/><stop offset="1" stop-color="#0e2430"/>
    </linearGradient>
    <linearGradient id="goldtxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cf6d"/><stop offset="1" stop-color="#c9932e"/>
    </linearGradient>
    <linearGradient id="cyanln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fa8b5" stop-opacity="0"/><stop offset="0.5" stop-color="#6fe3de"/><stop offset="1" stop-color="#2fa8b5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c9932e" stop-opacity="0.22"/><stop offset="1" stop-color="#c9932e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#hbg)" rx="14"/>
  <rect width="1200" height="420" fill="url(#glow)" rx="14"/>

  <!-- geometric anubis / weighing-the-heart emblem -->
  <g stroke="#c9932e" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 118 250 v -96 q 0 -26 26 -26 h 28 q 26 0 26 26 v 96"/>
    <path d="M 103 250 h 110"/>
    <path d="M 103 250 l -16 10 M 213 250 l 16 10"/>
    <path d="M 92 274 a 14 14 0 0 0 22 -24 z" fill="#c9932e" fill-opacity="0.35"/>
    <path d="M 202 274 a 14 14 0 0 0 22 -24 z" fill="#c9932e" fill-opacity="0.35"/>
  </g>
  <circle cx="158" cy="330" r="26" fill="none" stroke="#6fe3de" stroke-width="2.5"/>
  <path d="M 158 314 v 32 M 145 330 h 26" stroke="#6fe3de" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <text x="330" y="150" fill="url(#goldtxt)" font-size="50" font-weight="800" letter-spacing="4">⚱ ANUBIS GUARDIAN</text>
  <rect x="334" y="176" width="830" height="2.5" fill="url(#cyanln)"/>
  <text x="334" y="212" fill="#e8f2f7" font-size="23" font-weight="600">Security that covers the repository, guides the AI agent,</text>
  <text x="334" y="242" fill="#e8f2f7" font-size="23" font-weight="600">and catches risks before they ship.</text>
  <text x="334" y="272" fill="#8fb6c9" font-size="16">Open-source multi-layer security platform for software repositories and AI-assisted development</text>

  <g fill="#dceef5" font-size="14" font-weight="600">
    <rect x="334"  y="296" width="188" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="350"  y="318">repo &amp; git history</text>
    <rect x="538"  y="296" width="176" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="554"  y="318">config · CI · IaC</text>
    <rect x="730"  y="296" width="216" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="746"  y="318">code analysis (JS/TS)</text>
    <rect x="962"  y="296" width="202" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="978"  y="318">dependencies (npm)</text>
    <rect x="334"  y="340" width="188" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="350"  y="362">agent skill &amp; guard</text>
    <rect x="538"  y="340" width="176" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="554"  y="362">consent-gated URL</text>
    <rect x="730"  y="340" width="216" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="746"  y="362">scoring + SARIF report</text>
    <rect x="962"  y="340" width="202" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="978"  y="362">coverage manifest</text>
  </g>
  <text x="334" y="402" fill="#6d8a99" font-size="14">offline · deterministic · secrets masked · explicit coverage — evidence for human review, not a security guarantee</text>
</svg>
