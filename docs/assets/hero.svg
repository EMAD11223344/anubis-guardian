<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Anubis Guardian — deterministic security auditor for AI-built projects">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/><stop offset="0.55" stop-color="#0a1b26"/><stop offset="1" stop-color="#0e2430"/>
    </linearGradient>
    <linearGradient id="goldtxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cf6d"/><stop offset="1" stop-color="#c9932e"/>
    </linearGradient>
    <linearGradient id="cyanln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fa8b5" stop-opacity="0"/><stop offset="0.5" stop-color="#6fe3de"/><stop offset="1" stop-color="#2fa8b5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c9932e" stop-opacity="0.22"/><stop offset="1" stop-color="#c9932e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#hbg)" rx="14"/>
  <rect width="1200" height="420" fill="url(#glow)" rx="14"/>

  <!-- geometric anubis / weighing-the-heart emblem -->
  <g stroke="#c9932e" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 118 250 v -96 q 0 -26 26 -26 h 28 q 26 0 26 26 v 96"/>         <!-- post -->
    <path d="M 103 250 h 110"/>                                              <!-- beam -->
    <path d="M 103 250 l -16 10 M 213 250 l 16 10"/>                          <!-- hooks -->
    <path d="M 92 274 a 14 14 0 0 0 22 -24 z" fill="#c9932e" fill-opacity="0.35"/> <!-- left pan -->
    <path d="M 202 274 a 14 14 0 0 0 22 -24 z" fill="#c9932e" fill-opacity="0.35"/> <!-- right pan -->
  </g>
  <circle cx="158" cy="330" r="26" fill="none" stroke="#6fe3de" stroke-width="2.5"/>
  <path d="M 158 314 v 32 M 145 330 h 26" stroke="#6fe3de" stroke-width="2.5" fill="none" stroke-linecap="round"/> <!-- ankh -->

  <text x="330" y="176" fill="url(#goldtxt)" font-size="52" font-weight="800" letter-spacing="4">⚱ ANUBIS GUARDIAN</text>
  <rect x="334" y="204" width="830" height="2.5" fill="url(#cyanln)"/>
  <text x="334" y="240" fill="#8fb6c9" font-size="21">Deterministic security auditor for AI-built JavaScript / TypeScript projects</text>

  <g fill="#dceef5" font-size="15" font-weight="600">
    <g>
      <rect x="334"  y="272" width="204" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="352"  y="294">secrets &amp; history</text>
      <rect x="554"  y="272" width="188" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="570"  y="294">SAST · taint-lite</text>
      <rect x="758"  y="272" width="182" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="774"  y="294">dependencies</text>
      <rect x="956"  y="272" width="210" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="972"  y="294">CI / supply-chain</text>
      <rect x="334"  y="318" width="216" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="352"  y="340">authorization review</text>
      <rect x="566"  y="318" width="196" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="582"  y="340">consent-gated URL</text>
      <rect x="778"  y="318" width="168" height="34" rx="17" fill="#0f2530" stroke="#2b5f6e"/><text x="794"  y="340">SARIF output</text>
    </g>
  </g>
  <text x="334" y="386" fill="#6d8a99" font-size="14">offline · static-only · secrets masked · evidence for human review — not a security guarantee</text>
</svg>
