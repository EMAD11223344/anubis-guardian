<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08141c"/><stop offset="1" stop-color="#0c1e28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c554"/><stop offset="1" stop-color="#c9932e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe3de"/><stop offset="1" stop-color="#2fa8b5"/>
    </linearGradient>
  </defs>
  <rect width="920" height="480" fill="url(#bg)" rx="12"/>
  <text x="460" y="46" text-anchor="middle" fill="#f2e6c8" font-size="30" font-weight="700">⚱ ANUBIS GUARDIAN</text>
  <text x="460" y="70" text-anchor="middle" fill="#8fb6c9" font-size="15">Deterministic security auditor for JavaScript / TypeScript projects</text>

  <!-- MODE 1 -->
  <rect x="28" y="92" width="420" height="330" rx="10" fill="#0b1c17" stroke="#c9932e" stroke-width="1.5"/>
  <text x="238" y="124" text-anchor="middle" fill="url(#gold)" font-size="20" font-weight="700">MODE 1 — CODEBASE</text>
  <text x="238" y="146" text-anchor="middle" fill="#9db694" font-size="13">offline · static-only · reads files, never executes them</text>
  <g fill="#f2e6c8" font-size="14">
    <text x="52" y="180">① Secrets &amp; history — literals, .env, git-time travel</text>
    <text x="52" y="208">② SAST · taint-lite — SQLi, traversal, SSRF, XSS, exec</text>
    <text x="52" y="236">③ Dependencies — OSV scan, unpinned CI, supply-chain</text>
    <text x="52" y="264">④ Capability groups A–F — RBAC · tenancy · leakage ·</text>
    <text x="52" y="286" dx="24">resource exhaustion · large files · uploads</text>
    <text x="52" y="314">⑤ Framework playbooks — Next.js, NestJS, Supabase</text>
    <text x="52" y="342" font-size="13" fill="#b8b09a">(optional depth when the repo uses them)</text>
  </g>
  <text x="238" y="380" text-anchor="middle" fill="#8fb6c9" font-size="12">deterministic output · secrets masked · SARIF / JSON / HTML</text>
  <text x="238" y="402" text-anchor="middle" fill="#8fb6c9" font-size="12">review prompts marked needs_confirmation — never a verdict</text>

  <!-- MODE 2 -->
  <rect x="472" y="92" width="420" height="330" rx="10" fill="#0b1822" stroke="#2fa8b5" stroke-width="1.5"/>
  <text x="682" y="124" text-anchor="middle" fill="url(#cyan)" font-size="20" font-weight="700">MODE 2 — URL</text>
  <text x="682" y="146" text-anchor="middle" fill="#8fb6c9" font-size="13">deployed sites you own · consent-gated · passive-first</text>
  <g fill="#f2e6c8" font-size="14">
    <text x="496" y="184">L1 Passive — headers, cookies, bundle secrets</text>
    <text x="496" y="212">L2 Discovery — exposed .env / .git, listing, sourcemaps</text>
    <text x="496" y="240">L3 Probe — bounded, verified-ownership only</text>
  </g>
  <rect x="496" y="262" width="372" height="40" rx="6" fill="#10303a" stroke="#2fa8b5"/>
  <text x="682" y="287" text-anchor="middle" fill="#6fe3de" font-size="13" font-weight="600">requires verified ownership (DNS TXT / .well-known)</text>
  <text x="682" y="330" text-anchor="middle" fill="#8fb6c9" font-size="12">hard rate limits · robots-aware · SSRF-guarded redirects</text>
  <text x="682" y="352" text-anchor="middle" fill="#8fb6c9" font-size="12">private ranges &amp; metadata endpoints refused</text>
  <text x="682" y="382" text-anchor="middle" fill="#9db694" font-size="13" font-weight="600">Scanning systems you do not own is illegal —</text>
  <text x="682" y="402" text-anchor="middle" fill="#9db694" font-size="13" font-weight="600">the gate is enforced, not promised.</text>

  <rect x="28" y="440" width="864" height="26" rx="6" fill="#0d2330"/>
  <text x="460" y="457" text-anchor="middle" fill="#8fa8b8" font-size="12">npm install -g anubis-guardian · Node ≥ 18 · MIT · findings are prioritized evidence for human review, not a security guarantee</text>
</svg>
