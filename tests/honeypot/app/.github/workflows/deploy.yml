# honeypot seed: CI-001..004 — every classic Actions mistake in one file
name: deploy
on:
  pull_request_target:
    types: [opened, labeled]
  push:
    branches: [main]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@main
      - name: Greet the PR author
        run: |
          echo "Thanks ${{ github.event.pull_request.title }} for the PR!"
      - run: npm deploy --prod
